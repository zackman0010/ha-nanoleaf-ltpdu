[pytest]
asyncio_mode = auto
# -p "no:homeassistant" disables pytest_homeassistant_custom_component's own pytest11
# entry-point plugin (registered globally the moment the package is pip-installed —
# NOT something a conftest.py can opt out of). That plugin's fixture chain does an
# unconditional `import fcntl` (POSIX-only stdlib), which crashes pytest collection
# entirely on native Windows. Tests in this tree deliberately build their own minimal
# hass fixture (bare homeassistant.core.HomeAssistant() + MockConfigEntry, both of
# which import and run fine on Windows) instead of relying on that plugin's fixtures —
# see tests/test_coordinator.py's module docstring for the full explanation. If this
# ever runs somewhere with a working `fcntl` (Linux CI, WSL, real HAOS), this flag is
# harmless to remove, but isn't required to be removed either, since no test here
# depends on that plugin's fixtures.
addopts = -p "no:homeassistant"
